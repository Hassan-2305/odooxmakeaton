name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop
          POSTGRES_DB: brightloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightloop -d brightloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://brightloop:brightloop@localhost:5432/brightloop
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      BUSINESS_TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The API integration tests run against Postgres; without a migrated
      # database they would be skipped instead of failing.
      - name: Migrate test database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
